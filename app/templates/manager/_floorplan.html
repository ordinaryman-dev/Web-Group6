{% if plan_rooms %}
<div class="plan-legend">
  <span>Floor {{ plan_floor }}F · {{ plan_rooms|length }} rooms</span>
  <span>Colour = tonight’s status · blue line = window · arc = door · crossed box = lift shaft</span>
</div>
<div class="plan-wrap">{{ floorplan }}</div>
{% else %}
<p class="manager-empty">No rooms on this floor match the filters.</p>
{% endif %}
