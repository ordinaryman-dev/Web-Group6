{% extends "base.html" %}
{% block title %}{{ title }} · Hotel Hero{% endblock %}
{% block content %}
<section class="panel">
  <h1>{{ title }}</h1>
  <p>Signed in as {{ current_user.email }}.</p>
  <div class="actions">
    <a class="button" href="{{ url_for('catalog.index') }}">Browse rooms</a>
    <a class="button secondary" href="{{ url_for('accounts.profile') }}">My account</a>
    {% if current_user.role == 'manager' %}
      <a class="button secondary" href="{{ url_for('accounts.staff_list') }}">Manage staff</a>
    {% endif %}
  </div>
</section>
{% endblock %}
