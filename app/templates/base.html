<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hotel Hero{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('catalog.index') }}">Hotel Hero</a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('catalog.index') }}">Rooms</a>
        {% if current_user.is_authenticated %}
          <a href="{{ url_for('accounts.portal') }}">Workspace</a>
          <a href="{{ url_for('accounts.profile') }}">My account</a>
          <form class="inline" method="post" action="{{ url_for('accounts.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="nav-button" type="submit">Sign out</button>
          </form>
        {% else %}
          <a href="{{ url_for('accounts.login') }}">Sign in</a>
          <a href="{{ url_for('accounts.register') }}">Register</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="notice {{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
